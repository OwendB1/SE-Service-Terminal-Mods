name: Upload Ship Insurance to Steam Workshop

permissions:
  contents: read

on:
  push:
    branches:
      - production
    paths:
      - 'ShipInsurance/src/**'
      - '.github/workflows/steam-workshop-upload.yml'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          [ -n "${STEAM_USERNAME:-}" ] || { echo "Missing secret: STEAM_USERNAME"; exit 1; }
          [ -n "${STEAM_CONFIG_VDF:-}" ] || { echo "Missing secret: STEAM_CONFIG_VDF"; exit 1; }
          echo "::add-mask::$STEAM_CONFIG_VDF"

      - name: Build upload content
        run: |
          set -euo pipefail

          CONTENT_DIR="ShipInsurance/src"
          MODINFO_FILE="$CONTENT_DIR/modinfo.sbmi"
          STAGING="${RUNNER_TEMP}/ShipInsurance-upload"

          [ -d "$CONTENT_DIR" ] || { echo "Missing content folder: $CONTENT_DIR"; exit 1; }
          [ -f "$MODINFO_FILE" ] || { echo "Missing workshop metadata: $MODINFO_FILE"; exit 1; }

          WORKSHOP_ID="$(MODINFO_FILE="$MODINFO_FILE" python3 -c 'import xml.etree.ElementTree as ET, os; root = ET.parse(os.environ["MODINFO_FILE"]).getroot(); ids = root.findall(".//WorkshopIds/WorkshopId/Id"); print(((ids[0].text or "").strip()) if ids else "")')"
          [ -n "$WORKSHOP_ID" ] && [ "$WORKSHOP_ID" != "0" ] || { echo "Set ShipInsurance/src/modinfo.sbmi Workshop ID before upload."; exit 1; }

          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          rsync -a --delete "$CONTENT_DIR/" "$STAGING/"

          echo "WORKSHOP_ID=$WORKSHOP_ID" >> "$GITHUB_ENV"
          echo "STAGING_DIR=$STAGING" >> "$GITHUB_ENV"

      - name: Setup SteamCMD
        uses: andriivitiv/setup-steamcmd@v1.2.0

      - name: Create SteamCMD upload script
        run: |
          cat > "$RUNNER_TEMP/workshop_item.vdf" <<EOF
          "workshopitem"
          {
            "appid" "244850"
            "publishedfileid" "${WORKSHOP_ID}"
            "contentfolder" "${STAGING_DIR}"
            "changenote" "GitHub Actions build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})"
          }
          EOF

      - name: Install SteamCMD cached credentials
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          set -euo pipefail
          echo "::add-mask::$STEAM_CONFIG_VDF"
          mkdir -p "$HOME/Steam/config"
          printf '%s' "$STEAM_CONFIG_VDF" > "$HOME/Steam/config/config.vdf"
          chmod 600 "$HOME/Steam/config/config.vdf"

      - name: Upload workshop item
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: steamcmd +login "$STEAM_USERNAME" +workshop_build_item "$RUNNER_TEMP/workshop_item.vdf" +quit
